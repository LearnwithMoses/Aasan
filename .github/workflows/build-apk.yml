name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    name: Generate Android APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Google Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Create Android project directory
        run: mkdir -p android-twa

      - name: Initialize Android TWA project
        working-directory: android-twa
        run: |
          bubblewrap init \
            --manifest="https://ais-pre-xkk3dgpmo3wyoxyg3xwq7h-227581521045.asia-southeast1.run.app/manifest.webmanifest"

      - name: Build Android APK and AAB
        working-directory: android-twa
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: password123
          BUBBLEWRAP_KEY_PASSWORD: password123
        run: |
          bubblewrap build --skipPwaValidation

      - name: Show generated files
        working-directory: android-twa
        run: |
          echo "===== GENERATED ANDROID FILES ====="
          find . -type f \( -name "*.apk" -o -name "*.aab" \) -print
          echo "==================================="

      - name: Upload Android APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: aasan-android-app
          path: |
            android-twa/*.apk
            android-twa/*.aab
          if-no-files-found: error
          retention-days: 30
