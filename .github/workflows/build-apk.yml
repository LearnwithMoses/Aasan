name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Generate Android APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Google Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Initialize and Build Android APK
        run: |
          mkdir -p android-twa
          cd android-twa
          
          # Automated non-interactive initialization from manifest
          yes "" | bubblewrap init --manifest="https://ais-pre-xkk3dgpmo3wyoxyg3xwq7h-227581521045.asia-southeast1.run.app/manifest.webmanifest" || true

          # Build signed APK and AAB packages
          yes "password123" | bubblewrap build --skipPwaValidation || true

      - name: Upload Android Packages (APK & AAB)
        uses: actions/upload-artifact@v4
        with:
          name: aasan-android-packages
          path: |
            android-twa/*.apk
            android-twa/*.aab
            android-twa/app/build/outputs/apk/**/*.apk
          retention-days: 30
          if-no-files-found: warn
